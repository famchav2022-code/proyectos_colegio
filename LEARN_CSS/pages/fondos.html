<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efectos de Fondo - CSS Mastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #48bb78;
            --warning: #ed8936;
            --danger: #f56565;
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --bg-light: #0f3460;
            --text-light: #f1f1f1;
            --text-muted: #a0aec0;
            --editor-bg: #1e1e1e;
            --radius-sm: 6px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--bg-light);
        }

        .header h1 { font-size: 1.4rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
        .back-btn { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .back-btn:hover { color: #fff; }

        .main-container { flex: 1; display: flex; overflow: hidden; }

        /* Panel Izquierdo: Instrucciones */
        .sidebar { width: 350px; background: var(--bg-card); display: flex; flex-direction: column; border-right: 1px solid var(--bg-light); }
        .nav-challenges { display: flex; gap: 0.5rem; padding: 1rem; background: rgba(0,0,0,0.2); overflow-x: auto; }
        .challenge-btn {
            background: var(--bg-light); color: var(--text-muted); border: none; padding: 0.5rem 0.8rem;
            border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.85rem; min-width: 40px;
        }
        .challenge-btn.active { background: var(--primary); color: white; }
        .challenge-btn.completed { border: 2px solid var(--success); color: var(--success); }

        .instructions { flex: 1; padding: 1.5rem; overflow-y: auto; }
        .instructions h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--accent); }
        .instructions p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.5; }
        .hint-box { background: rgba(237, 137, 54, 0.1); border-left: 3px solid var(--warning); padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.85rem; color: #e2e8f0; }

        /* Panel Central: Editor */
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--editor-bg); }
        .panel-title { background: #151515; padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .editor-wrapper { flex: 1; display: flex; position: relative; font-family: 'Fira Code', monospace; font-size: 14px; }
        .line-numbers { padding: 1rem 0.5rem; color: #555; text-align: right; width: 40px; background: #1a1a1a; user-select: none; line-height: 1.6; }
        .code-textarea {
            flex: 1; background: transparent; color: #9cdcfe; border: none; resize: none; padding: 1rem;
            line-height: 1.6; font-family: inherit; font-size: inherit; outline: none; white-space: pre; overflow-x: auto;
        }

        /* Panel Derecho: Vista Previa */
        .preview-container { width: 400px; background: #fff; display: flex; flex-direction: column; border-left: 1px solid var(--bg-light); }
        .preview-box { flex: 1; display: flex; justify-content: center; align-items: center; background: #e2e8f0; padding: 2rem; position: relative; overflow: hidden; }
        
        /* Contenedor Estático de la Vista Previa */
        .preview-card-base {
            width: 100%; height: 100%; border-radius: var(--radius-md);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background-color: #ffffff; /* Color base inicial */
            transition: opacity 0.3s;
        }
        .preview-card-base h4 { font-size: 1.4rem; margin-bottom: 0.5rem; z-index: 2; }
        .preview-card-base p { font-size: 0.95rem; font-weight: 500; z-index: 2; }

        .text-overlay {
            background: rgba(255, 255, 255, 0.9); padding: 1rem; border-radius: var(--radius-sm); text-align: center; color: #333;
        }

        /* Barra de Acciones */
        .action-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--bg-card); border-top: 1px solid var(--bg-light); }
        .status-message { font-size: 0.85rem; font-weight: 600; padding: 0.4rem 0.75rem; border-radius: var(--radius-sm); }
        .status-message.pending { background: rgba(237, 137, 54, 0.2); color: var(--warning); }
        .status-message.success { background: rgba(72, 187, 120, 0.2); color: var(--success); }
        .btn-group { display: flex; gap: 0.75rem; }
        .btn { padding: 0.6rem 1.2rem; font-weight: 600; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-size: 0.9rem; transition: background 0.2s; }
        .btn-reset { background: transparent; color: var(--text-muted); border: 1px solid var(--text-muted); }
        .btn-reset:hover { color: #fff; border-color: #fff; }
        .btn-check { background: var(--success); color: white; }
        .btn-check:hover { background: #38a169; }
    </style>
</head>
<body>

    <header class="header">
        <h1><span>🖼️</span> Módulo: Efectos de Fondo y Opacidad</h1>
        <a href="../index.html" class="back-btn">← Volver al Inicio</a>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="nav-challenges" id="challenges-nav"></div>
            <div class="instructions">
                <h2 id="challenge-title">Cargando...</h2>
                <p id="challenge-desc">Cargando instrucciones...</p>
                <div class="hint-box" id="challenge-hint">Cargando sugerencia...</div>
            </div>
            <div class="action-bar">
                <span class="status-message pending" id="current-status">En progreso</span>
                <div class="btn-group">
                    <button class="btn btn-reset" onclick="resetCode()">Reiniciar</button>
                    <button class="btn btn-check" onclick="checkSolution()">Verificar</button>
                </div>
            </div>
        </aside>

        <main class="editor-container">
            <div class="panel-title">Editor CSS</div>
            <div class="editor-wrapper">
                <div class="line-numbers" id="line-numbers"></div>
                <textarea class="code-textarea" id="css-editor" spellcheck="false"></textarea>
            </div>
        </main>

        <section class="preview-container">
            <div class="panel-title">Vista Previa Real</div>
            <div class="preview-box">
                <style id="dynamic-styles"></style>
                
                <div id="caja-render" class="preview-card-base">
                    <div id="inner-content" class="text-overlay">
                        <h4 id="preview-heading">Título</h4>
                        <p id="preview-text">Subtítulo de la tarjeta</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const moduleKey = 'progress_fondos';
        let currentChallengeIndex = 0;

        const challenges = [
            {
                title: "1. Imagen de Fondo Básica",
                desc: "Usa la propiedad <code>background-image</code> pasándole la dirección url provista para colocar un fondo de montaña.",
                hint: "Escribe exactamente:<br>background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400');",
                starterCSS: ".caja-fondo {\n    background-image: \n}",
                expectedCSS: ["background-image:url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400');", "background-image:url(\"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400\");"],
                setupHTML: { heading: "Explora", text: "Aventura de Montaña", hideOverlay: true, textColor: "#fff" }
            },
            {
                title: "2. Escalar el Fondo (Cover)",
                desc: "Usa la propiedad <code>background-size</code> con el valor <code>cover</code> para que la foto llene toda la caja perfectamente.",
                hint: "Añade la línea:<br>background-size: cover;",
                starterCSS: ".caja-fondo {\n    background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400');\n    \n}",
                expectedCSS: ["background-size:cover;"],
                setupHTML: { heading: "Ajuste Perfecto", text: "Foto escalada sin cortes", hideOverlay: true, textColor: "#fff" }
            },
            {
                title: "3. Centrar la Imagen",
                desc: "Usa la propiedad <code>background-position</code> con el valor <code>center</code> para enfocar el fondo simétricamente.",
                hint: "Añade la línea:<br>background-position: center;",
                starterCSS: ".caja-fondo {\n    background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400');\n    background-size: cover;\n    \n}",
                expectedCSS: ["background-position:center;"],
                setupHTML: { heading: "Enfoque", text: "Imagen centrada", hideOverlay: true, textColor: "#fff" }
            },
            {
                title: "4. Color con Transparencia (RGBA)",
                desc: "Usa la propiedad <code>background-color</code> con el formato <code>rgba()</code>. Define fondo negro con opacidad al 60%.",
                hint: "Escribe exactamente:<br>background-color: rgba(0, 0, 0, 0.6);",
                starterCSS: ".caja-fondo {\n    \n}",
                expectedCSS: ["background-color:rgba(0,0,0,0.6);"],
                setupHTML: { heading: "Efecto Glass", text: "Fondo oscuro translúcido", hideOverlay: false, textColor: "#333" }
            },
            {
                title: "5. Opacidad del Elemento",
                desc: "Aplica una opacidad general del 40% (<code>0.4</code>) a la tarjeta usando la propiedad <code>opacity</code>.",
                hint: "Escribe dentro de las llaves:<br>opacity: 0.4;",
                starterCSS: ".caja-fondo {\n    background-color: #e94560;\n    \n}",
                expectedCSS: ["opacity:0.4;"],
                setupHTML: { heading: "Atenuado", text: "Opacidad total al 40%", hideOverlay: true, textColor: "#fff" }
            }
        ];

        const editor = document.getElementById('css-editor');

        function initNav() {
            const nav = document.getElementById('challenges-nav');
            nav.innerHTML = '';
            const completed = JSON.parse(localStorage.getItem(moduleKey) || '[]');
            
            challenges.forEach((ch, idx) => {
                const btn = document.createElement('button');
                btn.className = `challenge-btn ${idx === currentChallengeIndex ? 'active' : ''} ${completed.includes(idx) ? 'completed' : ''}`;
                btn.textContent = idx + 1;
                btn.onclick = () => loadChallenge(idx);
                nav.appendChild(btn);
            });
        }

        function loadChallenge(index) {
            currentChallengeIndex = index;
            const ch = challenges[index];
            
            document.getElementById('challenge-title').textContent = ch.title;
            document.getElementById('challenge-desc').innerHTML = ch.desc;
            document.getElementById('challenge-hint').innerHTML = `💡 <strong>Pista:</strong> ${ch.hint}`;
            
            editor.value = ch.starterCSS;
            
            const target = document.getElementById('caja-render');
            const inner = document.getElementById('inner-content');
            document.getElementById('preview-heading').textContent = ch.setupHTML.heading;
            document.getElementById('preview-text').textContent = ch.setupHTML.text;
            target.style.color = ch.setupHTML.textColor;

            // Forzar reseteo completo de estilos en línea previos
            target.style.cssText = '';
            target.className = "preview-card-base";

            if (ch.setupHTML.hideOverlay) {
                inner.style.display = "none";
            } else {
                inner.style.display = "block";
            }

            const status = document.getElementById('current-status');
            status.textContent = 'En progreso';
            status.className = 'status-message pending';

            initNav();
            updateActual();
            updateLineNumbers();
        }

        function updateActual() {
            let userCSS = editor.value;
            // 🛠️ TRUCO MAESTRO: Traducimos lo que escriba el alumno (.caja-fondo) hacia el ID real de renderizado (#caja-render)
            let parsedCSS = userCSS.replace(/\.caja-fondo/g, '#caja-render');
            document.getElementById('dynamic-styles').textContent = parsedCSS;
        }

        function checkSolution() {
            const userCSSClean = editor.value.replace(/\s+/g, '').toLowerCase();
            const ch = challenges[currentChallengeIndex];
            
            const isCorrect = ch.expectedCSS.some(expected => userCSSClean.includes(expected.replace(/\s+/g, '').toLowerCase()));

            const status = document.getElementById('current-status');
            if (isCorrect) {
                status.textContent = '¡Correcto! 🎉';
                status.className = 'status-message success';
                
                let completed = JSON.parse(localStorage.getItem(moduleKey) || '[]');
                if (!completed.includes(currentChallengeIndex)) {
                    completed.push(currentChallengeIndex);
                    localStorage.setItem(moduleKey, JSON.stringify(completed));
                }
                initNav();
            } else {
                status.textContent = 'Aún no es correcto ❌';
                status.className = 'status-message pending';
            }
        }

        function resetCode() {
            editor.value = challenges[currentChallengeIndex].starterCSS;
            updateActual();
        }

        function updateLineNumbers() {
            const lines = editor.value.split('\n').length;
            document.getElementById('line-numbers').innerHTML = Array.from({length: Math.max(lines, 12)}, (_, i) => i + 1).join('<br>');
        }

        editor.addEventListener('input', () => {
            updateActual();
            updateLineNumbers();
        });

        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
                updateActual();
                updateLineNumbers();
            }
        });

        loadChallenge(0);
    </script>
</body>
</html>
