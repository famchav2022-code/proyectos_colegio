<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo: Modificación de Contenidos - JS Mastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Reutilización exacta de los tokens del sistema visual de Selectores */
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-light: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --editor-bg: #1e1e1e;
            --success: #10b981;
            --warning: #f59e0b;
            --radius-sm: 6px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header { background: var(--bg-card); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bg-light); }
        .header h1 { font-size: 1.4rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
        .header h1 span { color: var(--primary); }
        .back-btn { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .back-btn:hover { color: #fff; }

        .main-container { flex: 1; display: flex; overflow: hidden; }

        .sidebar { width: 360px; background: var(--bg-card); display: flex; flex-direction: column; border-right: 1px solid var(--bg-light); }
        .nav-challenges { display: flex; gap: 0.5rem; padding: 1rem; background: rgba(0,0,0,0.2); overflow-x: auto; }
        .challenge-btn { background: var(--bg-light); color: var(--text-muted); border: none; padding: 0.5rem 0.8rem; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.85rem; min-width: 40px; }
        .challenge-btn.active { background: var(--primary); color: white; }
        .challenge-btn.completed { border: 2px solid var(--success); color: var(--success); }

        .instructions { flex: 1; padding: 1.5rem; overflow-y: auto; }
        .instructions h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--primary); }
        .instructions p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 1rem; line-height: 1.6; }
        .hint-box { background: rgba(245, 158, 11, 0.1); border-left: 3px solid var(--warning); padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.85rem; color: #e2e8f0; }

        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--editor-bg); }
        .panel-title { background: #111827; padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .editor-wrapper { flex: 1; display: flex; position: relative; font-family: 'Fira Code', monospace; font-size: 14px; }
        .line-numbers { padding: 1rem 0.5rem; color: #4b5563; text-align: right; width: 40px; background: #18181b; user-select: none; line-height: 1.6; }
        .code-textarea { flex: 1; background: transparent; color: #facc15; border: none; resize: none; padding: 1rem; line-height: 1.6; font-family: inherit; font-size: inherit; outline: none; white-space: pre; }

        .preview-container { width: 400px; background: #f1f5f9; display: flex; flex-direction: column; border-left: 1px solid var(--bg-light); color: #334155; }
        .preview-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; }
        
        .panel-repaso { background: #ffffff; padding: 1.5rem; border-radius: var(--radius-md); width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .marcador-puntos { font-size: 2.2rem; font-weight: 700; color: #2563eb; text-align: center; margin: 0.5rem 0; }
        .contenedor-vacio { border: 2px dashed #cbd5e1; padding: 1rem; border-radius: var(--radius-sm); margin-top: 1rem; min-height: 50px; text-align: center; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--bg-card); border-top: 1px solid var(--bg-light); }
        .status-message { font-size: 0.85rem; font-weight: 600; padding: 0.4rem 0.75rem; border-radius: var(--radius-sm); }
        .status-message.pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-message.success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .btn-group { display: flex; gap: 0.75rem; }
        .btn { padding: 0.6rem 1.2rem; font-weight: 600; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-size: 0.9rem; transition: background 0.2s; }
        .btn-reset { background: transparent; color: var(--text-muted); border: 1px solid var(--text-muted); }
        .btn-reset:hover { color: #fff; border-color: #fff; }
        .btn-check { background: var(--success); color: white; }
        .btn-check:hover { background: #059669; }
    </style>
</head>
<body>

    <header class="header">
        <h1>Módulo 2: Modificación de Contenidos (<span>innerHTML / textContent</span>)</h1>
        <a href="../INDEX.HTML" class="back-btn">← Volver al Panel</a>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="nav-challenges" id="challenges-nav"></div>
            <div class="instructions">
                <h2 id="challenge-title">Cargando...</h2>
                <p id="challenge-desc">Cargando...</p>
                <div class="hint-box" id="challenge-hint">Cargando...</div>
            </div>
            <div class="action-bar">
                <span class="status-message pending" id="current-status">En progreso</span>
                <div class="btn-group">
                    <button class="btn btn-reset" onclick="resetCode()">Reiniciar</button>
                    <button class="btn btn-check" onclick="checkSolution()">Verificar</button>
                </div>
            </div>
        </aside>

        <main class="editor-container">
            <div class="panel-title">Editor JavaScript</div>
            <div class="editor-wrapper">
                <div class="line-numbers" id="line-numbers"></div>
                <textarea class="code-textarea" id="js-editor" spellcheck="false"></textarea>
            </div>
        </main>

        <section class="preview-container">
            <div class="panel-title" style="background: #e2e8f0; color: #475569;">Vista Previa HTML Real</div>
            <div class="preview-box">
                
                <div class="panel-repaso">
                    <h3 id="titulo-sistema">Estudiante: Invitado</h3>
                    <div class="marcador-puntos" id="score">0</div>
                    <div id="caja-alerta" class="contenedor-vacio">Vacío</div>
                </div>

            </div>
        </section>
    </div>

    <script>
        const moduleKey = 'progress_js_contenido';
        let currentChallengeIndex = 0;

        const challenges = [
            {
                title: "1. Cambiar un Texto Plano",
                desc: "La propiedad <code>textContent</code> lee o modifica el texto de un elemento. Modifica el encabezado (con ID <code>'titulo-sistema'</code>) para que su texto sea exactamente igual a <code>'Estudiante: Conectado'</code>.",
                hint: "Primero selecciona el elemento por su ID y añade inmediatamente la extensión de propiedad:<br>elemento.textContent = '...';",
                starterCode: "const titulo = document.getElementById('titulo-sistema');\ntitulo.",
                validate: () => {
                    return document.getElementById('titulo-sistema').textContent === 'Estudiante: Conectado';
                }
            },
            {
                title: "2. Actualizar Marcador Numérico",
                desc: "Los números también pueden asignarse como texto. Modifica el valor numérico del marcador (con ID <code>'score'</code>) para que muestre el valor de <code>100</code>.",
                hint: "Aunque sea un número matemático, asígnalo directamente después del operador igual (=).",
                starterCode: "const marcador = document.getElementById('score');\nmarcador.",
                validate: () => {
                    return document.getElementById('score').textContent === '100';
                }
            },
            {
                title: "3. Limpiar Contenidos",
                desc: "Para vaciar el contenido de una etiqueta y dejarla sin texto, podemos asignarle una cadena vacía (<code>''</code>). Vacía el contenido de la caja de alerta (con ID <code>'caja-alerta'</code>).",
                hint: "Asigna un texto que contenga únicamente comillas abiertas y cerradas de forma continua sin espacios intermedios.",
                starterCode: "const alerta = document.getElementById('caja-alerta');\nalerta.",
                validate: () => {
                    return document.getElementById('caja-alerta').textContent === '';
                }
            },
            {
                title: "4. Inyectar Estructuras HTML",
                desc: "A diferencia de textContent, la propiedad <code>innerHTML</code> interpreta las etiquetas de código que coloques dentro del string. Modifica la caja con ID <code>'caja-alerta'</code> para inyectar un texto en negrita usando la etiqueta fuerte: <code>'&lt;strong&gt;¡Éxito!&lt;/strong&gt;'</code>.",
                hint: "Asegúrate de escribir la propiedad innerHTML respetando las mayúsculas de la sintaxis y encierra las etiquetas dentro de comillas.",
                starterCode: "const alerta = document.getElementById('caja-alerta');\nalerta.",
                validate: () => {
                    const el = document.getElementById('caja-alerta');
                    return el.innerHTML.toLowerCase().includes('<strong>¡éxito!</strong>') || el.innerHTML.toLowerCase().includes('<strong>¡éxito!</strong>'.replace(/\s+/g,''));
                }
            },
            {
                title: "5. Crear Botón Dinámico",
                desc: "Inyecta dentro de la misma caja con ID <code>'caja-alerta'</code> una etiqueta de botón funcional que diga 'Guardar' usando la estructura de código: <code>'&lt;button&gt;Guardar&lt;/button&gt;'</code>.",
                hint: "Utiliza la misma propiedad del desafío anterior para estructurar y dibujar la nueva etiqueta.",
                starterCode: "const alerta = document.getElementById('caja-alerta');\n",
                validate: () => {
                    const el = document.getElementById('caja-alerta');
                    return el.innerHTML.toLowerCase().includes('<button>guardar</button>');
                }
            }
        ];

        const editor = document.getElementById('js-editor');

        function initNav() {
            const nav = document.getElementById('challenges-nav');
            nav.innerHTML = '';
            const completed = JSON.parse(localStorage.getItem(moduleKey) || '[]');
            
            challenges.forEach((ch, idx) => {
                const btn = document.createElement('button');
                btn.className = `challenge-btn ${idx === currentChallengeIndex ? 'active' : ''} ${completed.includes(idx) ? 'completed' : ''}`;
                btn.textContent = idx + 1;
                btn.onclick = () => loadChallenge(idx);
                nav.appendChild(btn);
            });
        }

        function loadChallenge(index) {
            currentChallengeIndex = index;
            const ch = challenges[index];
            
            document.getElementById('challenge-title').textContent = ch.title;
            document.getElementById('challenge-desc').innerHTML = ch.desc;
            document.getElementById('challenge-hint').innerHTML = `💡 <strong>Reto de Análisis:</strong> ${ch.hint}`;
            
            // Reseteo del DOM base a sus valores originales para evitar contaminación entre retos
            document.getElementById('titulo-sistema').textContent = 'Estudiante: Invitado';
            document.getElementById('score').textContent = '0';
            document.getElementById('caja-alerta').innerHTML = 'Vacío';

            editor.value = ch.starterCode;

            const status = document.getElementById('current-status');
            status.textContent = 'En progreso';
            status.className = 'status-message pending';

            initNav();
            updateLineNumbers();
        }

        function checkSolution() {
            const userCode = editor.value;
            let success = false;

            try {
                // Ejecutamos el código del alumno directamente sobre la vista previa real
                const runScript = new Function(userCode);
                runScript();
                
                // Realizamos la validación del DOM posterior a la ejecución
                success = challenges[currentChallengeIndex].validate();
            } catch (error) {
                console.error(error);
                success = false;
            }

            const status = document.getElementById('current-status');
            if (success) {
                status.textContent = '¡Correcto! El DOM se actualizó 🎉';
                status.className = 'status-message success';
                
                let completed = JSON.parse(localStorage.getItem(moduleKey) || '[]');
                if (!completed.includes(currentChallengeIndex)) {
                    completed.push(currentChallengeIndex);
                    localStorage.setItem(moduleKey, JSON.stringify(completed));
                }
                initNav();
            } else {
                status.textContent = 'El contenido no coincide con lo solicitado ❌';
                status.className = 'status-message pending';
            }
        }

        function resetCode() {
            loadChallenge(currentChallengeIndex);
        }

        function updateLineNumbers() {
            const lines = editor.value.split('\n').length;
            document.getElementById('line-numbers').innerHTML = Array.from({length: Math.max(lines, 10)}, (_, i) => i + 1).join('<br>');
        }

        editor.addEventListener('input', updateLineNumbers);
        
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
                updateLineNumbers();
            }
        });

        loadChallenge(0);
    </script>
</body>
</html>
